services:
  airflow-webserver:
    build: .
    image: airflow-kedro:latest
    container_name: airflow-webserver
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    ports:
      - "8080:8080"
    volumes:
      - ./airflow:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project    
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Igor --lastname M --role Admin --email admin@example.com ||
        true &&
        airflow webserver
      "

  airflow-scheduler:
    image: airflow-kedro:latest
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-webserver
    volumes:
      - ./airflow:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project      
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    command: >
      bash -c "
        airflow scheduler
      "

volumes:
  airflow_logs:
  airflow_plugins:
